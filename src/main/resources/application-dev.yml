spring:
  datasource:
    url: jdbc:h2:file:./data/daycare
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  servlet:
    session:
      timeout: 30m

file:
  upload-dir: uploads/
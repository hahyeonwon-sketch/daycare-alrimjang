<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="content">
    <div>
        <div class="d-flex align-items-center gap-2 mb-4">
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">← 대시보드</a>
            <h4 class="fw-bold mb-0" style="color: var(--primary)">👶 원아 관리</h4>
        </div>

        <!-- 원아 등록 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="fw-bold mb-3" style="color: var(--primary)">원아 등록</div>
                <form th:action="@{/admin/child/save}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="row g-2">
                        <div class="col-md-3">
                            <input type="text" class="form-control" name="name" placeholder="원아 이름" required>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="classroomId" required>
                                <option value="">반 선택</option>
                                <option th:each="classroom : ${classrooms}"
                                        th:value="${classroom.id}"
                                        th:text="${classroom.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="parentId">
                                <option value="">학부모 선택 (선택사항)</option>
                                <option th:each="parent : ${activeParents}"
                                        th:value="${parent.id}"
                                        th:text="${parent.name} + ' (' + ${parent.email} + ')'"></option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">등록</button>
                </form>
            </div>
        </div>

        <!-- 원아 목록 -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="fw-bold mb-3" style="color: var(--primary)">원아 목록</div>
                <div th:if="${#lists.isEmpty(children)}" class="text-muted small">등록된 원아가 없습니다.</div>
                <table th:unless="${#lists.isEmpty(children)}" class="table table-hover mb-0">
                    <thead style="background-color: var(--primary-light);">
                    <tr>
                        <th>이름</th>
                        <th>반</th>
                        <th>연결된 학부모</th>
                        <th>학부모 추가 연결</th>
                        <th>삭제</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="child : ${children}">
                        <td th:text="${child.name}"></td>
                        <td th:text="${child.classroom.name}"></td>
                        <td>
                            <span th:each="parent, iter : ${child.parents}">
                                <span th:text="${parent.name}"></span>
                                <span th:unless="${iter.last}">, </span>
                            </span>
                            <span th:if="${#lists.isEmpty(child.parents)}" class="text-muted small">없음</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/child/{id}/link(id=${child.id})}" method="post" class="d-flex gap-2">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <select class="form-select form-select-sm" name="parentId" style="max-width: 200px;">
                                    <option value="">학부모 선택</option>
                                    <option th:each="parent : ${activeParents}"
                                            th:value="${parent.id}"
                                            th:text="${parent.name}"></option>
                                </select>
                                <button type="submit" class="btn btn-outline-secondary btn-sm">연결</button>
                            </form>
                        </td>
                        <td>
                            <form th:action="@{/admin/child/{id}/delete(id=${child.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-outline-danger btn-sm"
                                        onclick="return confirm('삭제하시겠습니까?')">삭제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>

</html>

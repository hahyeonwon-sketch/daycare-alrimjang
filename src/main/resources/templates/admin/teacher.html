<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="content">
    <div>
        <div class="d-flex align-items-center gap-2 mb-4">
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">← 대시보드</a>
            <h4 class="fw-bold mb-0" style="color: var(--primary)">👩‍🏫 교사 관리</h4>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">이미 사용 중인 이메일입니다.</div>

        <!-- 교사 계정 생성 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="fw-bold mb-3" style="color: var(--primary)">교사 계정 생성</div>
                <form th:action="@{/admin/teacher/save}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="row g-2">
                        <div class="col-md-3">
                            <input type="text" class="form-control" name="name" placeholder="이름" required>
                        </div>
                        <div class="col-md-3">
                            <input type="email" class="form-control" name="email" placeholder="이메일" required>
                        </div>
                        <div class="col-md-3">
                            <input type="password" class="form-control" name="password" placeholder="비밀번호" required>
                        </div>
                        <div class="col-md-3">
                            <select class="form-select" name="classroomId" required>
                                <option value="">반 선택</option>
                                <option th:each="classroom : ${classrooms}"
                                        th:value="${classroom.id}"
                                        th:text="${classroom.name}"></option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">생성</button>
                </form>
            </div>
        </div>

        <!-- 교사 목록 -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="fw-bold mb-3" style="color: var(--primary)">교사 목록</div>
                <div th:if="${#lists.isEmpty(teachers)}" class="text-muted small">등록된 교사가 없습니다.</div>
                <table th:unless="${#lists.isEmpty(teachers)}" class="table table-hover mb-0">
                    <thead style="background-color: var(--primary-light);">
                    <tr>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>삭제</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="teacher : ${teachers}">
                        <td th:text="${teacher.name}"></td>
                        <td th:text="${teacher.email}"></td>
                        <td>
                            <form th:action="@{/admin/teacher/{id}/delete(id=${teacher.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-outline-danger btn-sm"
                                        onclick="return confirm('삭제하시겠습니까?')">삭제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="content">
    <div>
        <div class="d-flex align-items-center gap-2 mb-4">
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">← 대시보드</a>
            <h4 class="fw-bold mb-0" style="color: var(--primary)">👨‍👩‍👧 학부모 승인</h4>
        </div>

        <!-- 승인 대기 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="fw-bold mb-3" style="color: var(--primary)">승인 대기</div>
                <div th:if="${#lists.isEmpty(pendingParents)}" class="text-muted small">대기 중인 학부모가 없습니다.</div>
                <table th:unless="${#lists.isEmpty(pendingParents)}" class="table table-hover mb-0">
                    <thead style="background-color: var(--primary-light);">
                    <tr>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>전화번호</th>
                        <th>신청 반</th>
                        <th>신청 원아</th>
                        <th>처리</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="parent : ${pendingParents}">
                        <td th:text="${parent.name}"></td>
                        <td th:text="${parent.email}"></td>
                        <td th:text="${parent.phone}"></td>
                        <td th:text="${parent.requestedClassName}"></td>
                        <td th:text="${parent.requestedChildName}"></td>
                        <td>
                            <div class="d-flex gap-2">
                                <form th:action="@{/admin/parent/{id}/approve(id=${parent.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-primary btn-sm">승인</button>
                                </form>
                                <form th:action="@{/admin/parent/{id}/reject(id=${parent.id})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-outline-danger btn-sm">거절</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 승인된 학부모 -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="fw-bold mb-3" style="color: var(--primary)">승인된 학부모</div>
                <div th:if="${#lists.isEmpty(activeParents)}" class="text-muted small">승인된 학부모가 없습니다.</div>
                <table th:unless="${#lists.isEmpty(activeParents)}" class="table table-hover mb-0">
                    <thead style="background-color: var(--primary-light);">
                    <tr>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>전화번호</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="parent : ${activeParents}">
                        <td th:text="${parent.name}"></td>
                        <td th:text="${parent.email}"></td>
                        <td th:text="${parent.phone}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>

</html>

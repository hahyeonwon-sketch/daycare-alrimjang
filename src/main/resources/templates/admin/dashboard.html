<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="content">
    <div>
        <div class="mb-4">
            <h4 class="fw-bold" style="color: var(--primary)">🌿 관리자 대시보드</h4>
        </div>

        <div class="row g-3">
            <div class="col-md-3">
                <div class="card shadow-sm p-3 text-center">
                    <div style="font-size: 2rem;">👩‍🏫</div>
                    <div class="fw-bold mt-2">교사 관리</div>
                    <a th:href="@{/admin/teacher}" class="btn btn-primary btn-sm mt-2">바로가기</a>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm p-3 text-center">
                    <div style="font-size: 2rem;">👶</div>
                    <div class="fw-bold mt-2">원아 관리</div>
                    <a th:href="@{/admin/child}" class="btn btn-primary btn-sm mt-2">바로가기</a>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm p-3 text-center">
                    <div style="font-size: 2rem;">👨‍👩‍👧</div>
                    <div class="fw-bold mt-2">학부모 승인</div>
                    <a th:href="@{/admin/parent}" class="btn btn-primary btn-sm mt-2">바로가기</a>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card shadow-sm p-3 text-center">
                    <div style="font-size: 2rem;">🏫</div>
                    <div class="fw-bold mt-2">반 관리</div>
                    <a th:href="@{/admin/classroom}" class="btn btn-primary btn-sm mt-2">바로가기</a>
                </div>
            </div>
        </div>
    </div>
</th:block>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <th:block layout:fragment="head-extra">
        <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    </th:block>
</head>

<th:block layout:fragment="content">
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold" style="color: var(--primary)">🌿 공지사항</h4>
            <button class="btn btn-primary" onclick="openAddModal()">+ 공지 등록</button>
        </div>

        <!-- 검색 + 기간 필터 -->
        <div class="d-flex flex-wrap gap-2 mb-3">
            <form th:action="@{/teacher/announcement/search}" method="get" class="d-flex gap-2">
                <input type="text" class="form-control" name="keyword"
                       th:value="${keyword}" placeholder="제목 또는 내용으로 검색" style="max-width: 250px;">
                <button type="submit" class="btn btn-outline-secondary">검색</button>
            </form>
            <form th:action="@{/teacher/announcement/date}" method="get" class="d-flex gap-2 align-items-center">
                <input type="date" class="form-control" name="startDate"
                       th:value="${startDate}" style="width: 150px;">
                <span class="text-muted">~</span>
                <input type="date" class="form-control" name="endDate"
                       th:value="${endDate}" style="width: 150px;">
                <button type="submit" class="btn btn-outline-secondary">기간 조회</button>
            </form>
            <a th:href="@{/teacher/announcement}" class="btn btn-outline-secondary">전체보기</a>
        </div>

        <div th:if="${#lists.isEmpty(announcements)}" class="text-center text-muted py-5">
            아직 등록된 공지사항이 없습니다.
        </div>

        <div class="row g-3">
            <div class="col-12" th:each="announcement : ${announcements}">
                <div class="card shadow-sm p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="fw-bold" th:text="${announcement.title}"></span>
                            <span th:if="${announcement.filePath != null}"
                                  class="badge ms-2" style="background-color: var(--primary)">첨부파일</span>
                        </div>
                        <div class="d-flex gap-2 align-items-center">
                        <span class="text-muted small"
                              th:text="${#temporals.format(announcement.createdAt, 'yyyy.MM.dd')}"></span>
                            <a th:href="@{/teacher/announcement/{id}(id=${announcement.id})}"
                               class="btn btn-outline-secondary btn-sm">상세</a>
                            <form th:action="@{/teacher/announcement/{id}/delete(id=${announcement.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-outline-danger btn-sm"
                                        onclick="return confirm('삭제하시겠습니까?')">삭제</button>
                            </form>
                        </div>
                    </div>
                    <div class="text-muted small mt-2"
                         th:utext="${#strings.abbreviate(announcement.content, 50)}"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 공지사항 등록 모달 -->
    <div class="modal fade" id="announcementModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background-color: var(--primary-light);">
                    <h5 class="modal-title fw-bold">공지사항 등록</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="announcementForm" th:action="@{/teacher/announcement/save}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">제목</label>
                            <input type="text" class="form-control" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">내용</label>
                            <div id="editor" style="height: 200px;"></div>
                            <input type="hidden" name="content" id="content">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">첨부파일 (PDF·이미지)</label>
                            <input type="file" class="form-control" name="file" accept=".pdf,image/*">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary px-4 py-2" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary px-4 py-2">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="script-extra">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script>
        const quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    [{ 'align': [] }],
                    [{ 'size': ['small', false, 'large', 'huge'] }],
                    ['clean']
                ]
            }
        });

        function openAddModal() {
            quill.setText('');
            new bootstrap.Modal(document.getElementById('announcementModal')).show();
        }

        document.getElementById('announcementForm').addEventListener('submit', function() {
            document.getElementById('content').value = quill.root.innerHTML;
        });
    </script>
</th:block>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>알림장 - 어린이집</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="container py-4">

    <!-- 상단 헤더 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold" style="color: var(--primary)">🌸 알림장</h4>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold" style="color: var(--primary)">🌸 알림장</h4>
            <form th:action="@{/auth/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-secondary btn-sm">로그아웃</button>
            </form>
        </div>
    </div>

    <!-- 날짜 선택 -->
    <div class="mb-3">
        <form method="get" th:action="@{/teacher/notice}" class="d-flex gap-2 align-items-center">
            <input type="date" name="date" class="form-control" style="width: 200px;"
                   th:value="${selectedDate}">
            <button type="submit" class="btn btn-primary btn-sm">조회</button>
        </form>
    </div>

    <!-- 원아 목록 테이블 -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr style="background-color: var(--primary-light);">
                    <th class="ps-4">원아 이름</th>
                    <th>등원 여부</th>
                    <th>학부모 메모</th>
                    <th>읽은 시간</th>
                    <th>작성</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="notice : ${noticeList}">
                    <td class="ps-4 fw-bold" th:text="${notice.childName}"></td>
                    <td>
                        <span th:if="${notice.attended}" class="badge bg-success">O</span>
                        <span th:unless="${notice.attended}" class="badge bg-secondary">X</span>
                    </td>
                    <td>
                            <span th:if="${notice.parentMemoContent != null}"
                                  th:text="${#strings.abbreviate(notice.parentMemoContent, 20)}"
                                  class="text-muted small"></span>
                        <span th:unless="${notice.parentMemoContent != null}"
                              class="text-muted small">-</span>
                    </td>
                    <td>
                            <span th:if="${notice.readAt != null}"
                                  th:text="${#temporals.format(notice.readAt, 'HH:mm')}"
                                  class="text-muted small"></span>
                        <span th:unless="${notice.readAt != null}"
                              class="text-muted small">미확인</span>
                    </td>
                    <td>
                        <button class="btn btn-primary btn-sm"
                                th:data-child-id="${notice.childId}"
                                th:data-child-name="${notice.childName}"
                                th:data-attended="${notice.attended}"
                                th:data-meal="${notice.meal}"
                                th:data-play="${notice.play}"
                                th:data-toilet="${notice.toilet}"
                                th:data-special="${notice.special}"
                                th:data-extra="${notice.extra}"
                                th:data-photos="${notice.photoFileNames}"
                                onclick="openModal(this)">
                            작성
                        </button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(noticeList)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        담당 반 원아가 없습니다.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 알림장 작성 모달 -->
<div class="modal fade" id="noticeModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header" style="background-color: var(--primary-light);">
                <h5 class="modal-title fw-bold" id="modalTitle">알림장 작성</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/teacher/notice/save}" method="post" enctype="multipart/form-data">
                <div class="modal-body">
                    <input type="hidden" name="childId" id="modalChildId">
                    <input type="hidden" name="date" th:value="${selectedDate}">

                    <!-- 등원 여부 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">등원 여부</label>
                        <div class="d-flex gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="attended" value="true" id="attendedY" checked>
                                <label class="form-check-label" for="attendedY">O (등원)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="attended" value="false" id="attendedN">
                                <label class="form-check-label" for="attendedN">X (미등원)</label>
                            </div>
                        </div>
                    </div>

                    <!-- 식사 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">식사</label>
                        <textarea class="form-control" name="meal" rows="2" placeholder="식사 내용을 입력하세요"></textarea>
                    </div>

                    <!-- 오늘의 놀이 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">오늘의 놀이</label>
                        <textarea class="form-control" name="play" rows="2" placeholder="오늘의 놀이 내용을 입력하세요"></textarea>
                    </div>

                    <!-- 배변 사항 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">배변 사항</label>
                        <textarea class="form-control" name="toilet" rows="2" placeholder="배변 사항을 입력하세요"></textarea>
                    </div>

                    <!-- 특이 사항 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">특이 사항</label>
                        <textarea class="form-control" name="special" rows="2" placeholder="특이 사항을 입력하세요"></textarea>
                    </div>

                    <!-- 기타 공지 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">기타 공지</label>
                        <textarea class="form-control" name="extra" rows="2" placeholder="기타 공지를 입력하세요"></textarea>
                    </div>

                    <!-- 사진 업로드 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">사진 업로드 (최대 5장)</label>
                        <input type="file" class="form-control" id="photoInput"
                               name="photos" multiple accept="image/*"
                               onchange="previewPhotos(this)">
                    </div>

                    <!-- 사진 미리보기 슬라이드 -->
                    <div id="previewArea" class="d-none">
                        <label class="form-label fw-bold">사진 미리보기</label>
                        <div id="previewCarousel" class="carousel slide border rounded p-2" data-bs-ride="false">
                            <div class="carousel-inner" id="carouselInner"></div>
                            <button class="carousel-control-prev" type="button"
                                    data-bs-target="#previewCarousel" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" style="filter: invert(1)"></span>
                            </button>
                            <button class="carousel-control-next" type="button"
                                    data-bs-target="#previewCarousel" data-bs-slide="next">
                                <span class="carousel-control-next-icon" style="filter: invert(1)"></span>
                            </button>
                        </div>
                        <div class="text-muted small mt-1" id="photoCount"></div>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="submit" class="btn btn-primary">저장</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function openModal(btn) {
        const childId = btn.getAttribute('data-child-id');
        const childName = btn.getAttribute('data-child-name');
        const attended = btn.getAttribute('data-attended');
        const meal = btn.getAttribute('data-meal') || '';
        const play = btn.getAttribute('data-play') || '';
        const toilet = btn.getAttribute('data-toilet') || '';
        const special = btn.getAttribute('data-special') || '';
        const extra = btn.getAttribute('data-extra') || '';
        const photosAttr = btn.getAttribute('data-photos') || '[]';

        document.getElementById('modalChildId').value = childId;
        document.getElementById('modalTitle').textContent = childName + ' 알림장 작성';

        // 기존 내용 채우기
        document.querySelector('[name=meal]').value = meal;
        document.querySelector('[name=play]').value = play;
        document.querySelector('[name=toilet]').value = toilet;
        document.querySelector('[name=special]').value = special;
        document.querySelector('[name=extra]').value = extra;

        // 등원 여부
        if (attended === 'true') {
            document.getElementById('attendedY').checked = true;
        } else {
            document.getElementById('attendedN').checked = true;
        }

        // 기존 사진 미리보기
        const carouselInner = document.getElementById('carouselInner');
        const previewArea = document.getElementById('previewArea');
        const photoCount = document.getElementById('photoCount');

        carouselInner.innerHTML = '';
        document.getElementById('photoInput').value = '';

        // 저장된 사진 파싱
        const photos = photosAttr.replace('[', '').replace(']', '')
            .split(',').map(s => s.trim()).filter(s => s.length > 0);

        if (photos.length > 0) {
            photos.forEach((fileName, index) => {
                const item = document.createElement('div');
                item.className = 'carousel-item' + (index === 0 ? ' active' : '');
                item.innerHTML = `
                    <div class="position-relative">
                        <img src="/uploads/${fileName}" class="d-block w-100 rounded"
                             style="max-height: 300px; object-fit: contain; background: #f8f8f8;">
                        <span class="position-absolute top-0 end-0 badge bg-dark m-2">
                            ${index + 1} / ${photos.length}
                        </span>
                    </div>`;
                carouselInner.appendChild(item);
            });
            photoCount.textContent = `${photos.length}장 저장됨`;
            previewArea.classList.remove('d-none');
        } else {
            previewArea.classList.add('d-none');
        }

        new bootstrap.Modal(document.getElementById('noticeModal')).show();
    }

    function previewPhotos(input) {
        const files = Array.from(input.files);

        if (files.length > 5) {
            alert('사진은 최대 5장까지 업로드 가능합니다.');
            input.value = '';
            return;
        }

        const carouselInner = document.getElementById('carouselInner');
        const previewArea = document.getElementById('previewArea');
        const photoCount = document.getElementById('photoCount');

        carouselInner.innerHTML = '';

        if (files.length === 0) {
            previewArea.classList.add('d-none');
            return;
        }

        files.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const item = document.createElement('div');
                item.className = 'carousel-item' + (index === 0 ? ' active' : '');
                item.innerHTML = `
                    <div class="position-relative">
                        <img src="${e.target.result}" class="d-block w-100 rounded"
                             style="max-height: 300px; object-fit: contain; background: #f8f8f8;">
                        <span class="position-absolute top-0 end-0 badge bg-dark m-2">
                            ${index + 1} / ${files.length}
                        </span>
                    </div>`;
                carouselInner.appendChild(item);
            };
            reader.readAsDataURL(file);
        });

        photoCount.textContent = `${files.length}장 선택됨`;
        previewArea.classList.remove('d-none');
    }
</script>

</body>
</html>

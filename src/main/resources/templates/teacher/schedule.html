<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <th:block layout:fragment="head-extra">
        <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    </th:block>
</head>

<th:block layout:fragment="content">
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold" style="color: var(--primary)">🌿 일정 관리</h4>
            <button class="btn btn-primary" onclick="openAddModal()">+ 일정 등록</button>
        </div>

        <div class="card shadow-sm p-3">
            <div id="calendar"></div>
        </div>
    </div>

    <!-- 일정 등록/수정 모달 -->
    <div class="modal fade" id="scheduleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" style="background-color: var(--primary-light);">
                    <h5 class="modal-title fw-bold" id="scheduleModalTitle">일정 등록</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="scheduleForm" th:action="@{/teacher/schedule/save}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">제목</label>
                            <input type="text" class="form-control" name="title" id="scheduleTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">날짜</label>
                            <input type="date" class="form-control" name="date" id="scheduleDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">내용</label>
                            <textarea class="form-control" name="content" id="scheduleContent" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary px-4 py-2" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary px-4 py-2">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 일정 상세/삭제 모달 -->
    <div class="modal fade" id="scheduleDetailModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" style="background-color: var(--primary-light);">
                    <h5 class="modal-title fw-bold">일정 상세</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">제목</label>
                        <input type="text" class="form-control" id="detailTitle" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">날짜</label>
                        <input type="date" class="form-control" id="detailDate" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">내용</label>
                        <textarea class="form-control" id="detailContent" rows="3" readonly></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <form id="deleteForm" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-danger px-4 py-2">삭제</button>
                    </form>
                    <button class="btn btn-primary px-4 py-2" onclick="openEditModal()">수정</button>
                    <button type="button" class="btn btn-outline-secondary px-4 py-2" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="script-extra">
    <script th:inline="javascript">
        const scheduleData = /*[[${schedules}]]*/ [];
    </script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script>
        let currentScheduleId = null;

        document.addEventListener('DOMContentLoaded', function() {
            const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: 'dayGridMonth',
                locale: 'ko',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,listWeek'
                },
                events: scheduleData.map(s => ({
                    id: s.id,
                    title: s.title,
                    start: s.date,
                    extendedProps: { content: s.content }
                })),
                dateClick: function(info) { openAddModal(info.dateStr); },
                eventClick: function(info) { openDetailModal(info.event); }
            });
            calendar.render();
        });

        function openAddModal(date = '') {
            document.getElementById('scheduleModalTitle').textContent = '일정 등록';
            document.getElementById('scheduleTitle').value = '';
            document.getElementById('scheduleDate').value = date;
            document.getElementById('scheduleContent').value = '';
            document.getElementById('scheduleForm').action = '/teacher/schedule/save';
            new bootstrap.Modal(document.getElementById('scheduleModal')).show();
        }

        function openDetailModal(event) {
            currentScheduleId = event.id;
            document.getElementById('detailTitle').value = event.title;
            document.getElementById('detailDate').value = event.startStr;
            document.getElementById('detailContent').value = event.extendedProps.content || '';
            document.getElementById('deleteForm').action = '/teacher/schedule/' + event.id + '/delete';
            new bootstrap.Modal(document.getElementById('scheduleDetailModal')).show();
        }

        function openEditModal() {
            bootstrap.Modal.getInstance(document.getElementById('scheduleDetailModal')).hide();
            document.getElementById('scheduleModalTitle').textContent = '일정 수정';
            document.getElementById('scheduleTitle').value = document.getElementById('detailTitle').value;
            document.getElementById('scheduleDate').value = document.getElementById('detailDate').value;
            document.getElementById('scheduleContent').value = document.getElementById('detailContent').value;
            document.getElementById('scheduleForm').action = '/teacher/schedule/' + currentScheduleId + '/update';
            new bootstrap.Modal(document.getElementById('scheduleModal')).show();
        }
    </script>
</th:block>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <th:block layout:fragment="head-extra">
        <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    </th:block>
</head>

<th:block layout:fragment="content">
    <div>
        <div class="d-flex align-items-center gap-2 mb-4">
            <a th:href="@{/teacher/announcement}" class="btn btn-outline-secondary btn-sm">← 목록</a>
            <h4 class="fw-bold mb-0" style="color: var(--primary)" th:text="${announcement.title}"></h4>
        </div>

        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="d-flex justify-content-between mb-3">
                <span class="text-muted small"
                      th:text="${#temporals.format(announcement.createdAt, 'yyyy년 MM월 dd일')}"></span>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-secondary btn-sm" onclick="openEditModal()">수정</button>
                        <form th:action="@{/teacher/announcement/{id}/delete(id=${announcement.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('삭제하시겠습니까?')">삭제</button>
                        </form>
                    </div>
                </div>

                <div th:utext="${announcement.content}" class="mb-3"></div>

                <div th:if="${announcement.filePath != null}" class="mt-3">
                    <a th:href="@{/uploads/{file}(file=${announcement.filePath})}"
                       class="btn btn-outline-secondary btn-sm" target="_blank">
                        📎 첨부파일 보기
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- 수정 모달 -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background-color: var(--primary-light);">
                    <h5 class="modal-title fw-bold">공지사항 수정</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="editForm" th:action="@{/teacher/announcement/{id}/update(id=${announcement.id})}"
                      method="post" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">제목</label>
                            <input type="text" class="form-control" name="title"
                                   th:value="${announcement.title}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">내용</label>
                            <div id="editEditor" style="height: 200px;"></div>
                            <input type="hidden" name="content" id="editContent">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">첨부파일 교체 (선택)</label>
                            <input type="file" class="form-control" name="file" accept=".pdf,image/*">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary px-4 py-2" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary px-4 py-2">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="script-extra">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script th:inline="javascript">
        const existingContent = /*[[${announcement.content}]]*/ '';
    </script>
    <script>
        const editQuill = new Quill('#editEditor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    [{ 'color': [] }, { 'background': [] }],
                    [{ 'align': [] }],
                    [{ 'size': ['small', false, 'large', 'huge'] }],
                    ['clean']
                ]
            }
        });

        function openEditModal() {
            editQuill.root.innerHTML = existingContent || '';
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        document.getElementById('editForm').addEventListener('submit', function() {
            document.getElementById('editContent').value = editQuill.root.innerHTML;
        });
    </script>
</th:block>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="content">
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0" style="color: var(--primary)">🔔 알림</h4>
            <form th:action="@{/parent/notifications/read-all}" method="post"
                  th:if="${unreadCount > 0}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-secondary btn-sm">전체 읽음</button>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(notifications)}" class="text-center text-muted py-5">
            알림이 없습니다.
        </div>

        <div class="d-flex flex-column gap-2">
            <div th:each="noti : ${notifications}"
                 class="card shadow-sm"
                 th:classappend="${!noti.read} ? ' border-start border-3 border-primary' : ''">
                <div class="card-body py-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span th:if="${!noti.read}"
                                  class="badge me-2" style="background-color: var(--primary); font-size: 0.7rem;">NEW</span>
                            <span th:text="${noti.message}" class="text-dark"></span>
                        </div>
                        <span class="text-muted small"
                              th:text="${#temporals.format(noti.createdAt, 'MM/dd HH:mm')}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

</html>

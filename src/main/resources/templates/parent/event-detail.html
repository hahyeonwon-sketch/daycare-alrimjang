<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="content">
    <div>
        <div class="d-flex align-items-center gap-2 mb-4">
            <a th:href="@{/parent/event}" class="btn btn-outline-secondary btn-sm">←목록</a>
            <h4 class="fw-bold mb-0" style="color: var(--primary)" th:text="${eventReport.title}"></h4>
        </div>

        <div class="card shadow-sm mb-3">
            <div class="card-body text-center">
                <div class="text-muted small mb-3"
                     th:text="${#temporals.format(eventReport.eventDate, 'yyyy년 MM월 dd일')}"></div>

                <div th:utext="${eventReport.content}" style="white-space: pre-wrap;" class="mb-3"></div>

                <div th:if="${not #lists.isEmpty(eventReport.photos)}" class="mt-3">
                    <div id="photoCarousel" class="carousel slide border rounded p-2" data-bs-ride="false">
                        <div class="carousel-inner">
                            <div th:each="photo, iter : ${eventReport.photos}"
                                 th:class="${iter.first} ? 'carousel-item active' : 'carousel-item'">
                                <div class="position-relative">
                                    <img th:src="@{/uploads/{file}(file=${photo.filePath})}"
                                         class="d-block w-100 rounded"
                                         style="max-height: 400px; object-fit: contain; background: #f8f8f8;">
                                    <span class="position-absolute top-0 end-0 badge bg-dark m-2"
                                          th:text="${iter.index + 1} + ' / ' + ${iter.size}"></span>
                                </div>
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button"
                                data-bs-target="#photoCarousel" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" style="filter: invert(1)"></span>
                        </button>
                        <button class="carousel-control-next" type="button"
                                data-bs-target="#photoCarousel" data-bs-slide="next">
                            <span class="carousel-control-next-icon" style="filter: invert(1)"></span>
                        </button>
                    </div>
                    <div class="mt-2 d-flex gap-2 flex-wrap justify-content-center">
                        <a th:each="photo, iter : ${eventReport.photos}"
                           th:href="@{/download/{file}(file=${photo.filePath})}"
                           th:text="'사진 ' + ${iter.index + 1} + ' 다운로드'"
                           class="btn btn-outline-secondary btn-sm"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <th:block layout:fragment="head-extra">
        <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    </th:block>
</head>

<th:block layout:fragment="content">
    <div>
        <div class="d-flex align-items-center gap-2 mb-4">
            <a th:href="@{/teacher/event}" class="btn btn-outline-secondary btn-sm">← 목록</a>
            <h4 class="fw-bold mb-0" style="color: var(--primary)" th:text="${eventReport.title}"></h4>
        </div>

        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="d-flex justify-content-between mb-3">
                <span class="text-muted small"
                      th:text="${#temporals.format(eventReport.eventDate, 'yyyy년 MM월 dd일')}"></span>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-secondary btn-sm" onclick="openEditModal()">수정</button>
                        <form th:action="@{/teacher/event/{id}/delete(id=${eventReport.id})}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('삭제하시겠습니까?')">삭제</button>
                        </form>
                    </div>
                </div>

                <div th:utext="${eventReport.content}" style="white-space: pre-wrap;" class="mb-3"></div>

                <!-- 사진 슬라이드 -->
                <div th:if="${not #lists.isEmpty(eventReport.photos)}" class="mt-3">
                    <div id="photoCarousel" class="carousel slide border rounded p-2" data-bs-ride="false">
                        <div class="carousel-inner">
                            <div th:each="photo, iter : ${eventReport.photos}"
                                 th:class="${iter.first} ? 'carousel-item active' : 'carousel-item'">
                                <div class="position-relative">
                                    <img th:src="@{/uploads/{file}(file=${photo.filePath})}"
                                         class="d-block w-100 rounded"
                                         style="max-height: 400px; object-fit: contain; background: #f8f8f8;">
                                    <span class="position-absolute top-0 end-0 badge bg-dark m-2"
                                          th:text="${iter.index + 1} + ' / ' + ${iter.size}"></span>
                                </div>
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button"
                                data-bs-target="#photoCarousel" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" style="filter: invert(1)"></span>
                        </button>
                        <button class="carousel-control-next" type="button"
                                data-bs-target="#photoCarousel" data-bs-slide="next">
                            <span class="carousel-control-next-icon" style="filter: invert(1)"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 수정 모달 -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background-color: var(--primary-light);">
                    <h5 class="modal-title fw-bold">행사보고 수정</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="editForm" th:action="@{/teacher/event/{id}/update(id=${eventReport.id})}"
                      method="post" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">행사명</label>
                            <input type="text" class="form-control" name="title"
                                   th:value="${eventReport.title}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">행사 날짜</label>
                            <input type="date" class="form-control" name="eventDate"
                                   th:value="${eventReport.eventDate}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">내용</label>
                            <div id="editEditor" style="height: 200px;"></div>
                            <input type="hidden" name="content" id="editContent">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">사진 추가</label>
                            <input type="file" class="form-control" name="photos"
                                   multiple accept="image/*">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary px-4 py-2" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary px-4 py-2">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="script-extra">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script th:inline="javascript">
        const existingContent = /*[[${eventReport.content}]]*/ '';
    </script>
    <script>
        const editQuill = new Quill('#editEditor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    [{ 'align': [] }],
                    [{ 'size': ['small', false, 'large', 'huge'] }],
                    ['clean']
                ]
            }
        });

        function openEditModal() {
            editQuill.root.innerHTML = existingContent || '';
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        document.getElementById('editForm').addEventListener('submit', function() {
            document.getElementById('editContent').value = editQuill.root.innerHTML;
        });
    </script>
</th:block>

</html>

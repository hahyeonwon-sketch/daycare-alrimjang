<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>알림장 - 어린이집</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="container py-4">

    <!-- 상단 헤더 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold" style="color: var(--primary)">알림장</h4>
        <form th:action="@{/auth/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-secondary btn-sm">로그아웃</button>
        </form>
    </div>

    <!-- 알림장 목록 -->
    <div th:if="${#lists.isEmpty(notices)}" class="text-center text-muted py-5">
        아직 등록된 알림장이 없습니다.
    </div>

    <div class="row g-3">
        <div class="col-12" th:each="notice : ${notices}">
            <a th:href="@{/parent/notice/{id}(id=${notice.id})}"
               class="text-decoration-none">
                <div class="card shadow-sm p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="fw-bold" style="color: var(--primary)"
                                  th:text="${#temporals.format(notice.date, 'yyyy년 MM월 dd일')}"></span>
                            <span th:if="${notice.attended}"
                                  class="badge ms-2" style="background-color: var(--primary)">등원</span>
                            <span th:unless="${notice.attended}"
                                  class="badge bg-secondary ms-2">미등원</span>
                        </div>
                        <div>
                            <span th:if="${notice.noticeRead != null}"
                                  class="text-muted small">
                                읽음 <span th:text="${#temporals.format(notice.noticeRead.readAt, 'HH:mm')}"></span>
                            </span>
                            <span th:unless="${notice.noticeRead != null}"
                                  class="badge" style="background-color: var(--primary)">NEW</span>
                        </div>
                    </div>
                    <div class="text-muted small mt-2"
                         th:if="${notice.meal != null}"
                         th:text="'식사: ' + ${#strings.abbreviate(notice.meal, 30)}"></div>
                </div>
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

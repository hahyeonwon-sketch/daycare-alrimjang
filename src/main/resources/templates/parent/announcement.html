<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="content">
    <div>
        <div class="mb-4">
            <h4 class="fw-bold" style="color: var(--primary)">🌿 공지사항</h4>
        </div>

        <form th:action="@{/parent/announcement/search}" method="get" class="mb-3 d-flex gap-2">
            <input type="text" class="form-control" name="keyword"
                   th:value="${keyword}" placeholder="제목 또는 내용으로 검색" style="max-width: 300px;">
            <button type="submit" class="btn btn-outline-secondary">검색</button>
            <a th:href="@{/parent/announcement}" class="btn btn-outline-secondary">전체보기</a>
        </form>

        <div th:if="${#lists.isEmpty(announcements)}" class="text-center text-muted py-5">
            아직 등록된 공지사항이 없습니다.
        </div>

        <div class="row g-3">
            <div class="col-12" th:each="announcement : ${announcements}">
                <a th:href="@{/parent/announcement/{id}(id=${announcement.id})}"
                   class="text-decoration-none">
                    <div class="card shadow-sm p-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-bold text-dark" th:text="${announcement.title}"></span>
                            <div class="d-flex gap-2 align-items-center">
                            <span th:if="${announcement.filePath != null}"
                                  class="badge" style="background-color: var(--primary)">첨부파일</span>
                                <span class="text-muted small"
                                      th:text="${#temporals.format(announcement.createdAt, 'yyyy.MM.dd')}"></span>
                            </div>
                        </div>
                        <div class="text-muted small mt-2"
                             th:text="${#strings.abbreviate(announcement.content, 50)}"></div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</th:block>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="content">
    <div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0" style="color: var(--primary)"
                th:text="${childName} + ' - ' + ${#temporals.format(selectedDate, 'yyyy년 MM월 dd일')} + ' 알림장'"></h4>
            <a th:href="@{/parent/notice/list}" class="btn btn-outline-secondary btn-sm">지난 알림장</a>
        </div>

        <!-- 날짜 선택 -->
        <div class="mb-3">
            <form method="get" th:action="@{/parent/notice}" class="d-flex gap-2 align-items-center">
                <input type="date" name="date" class="form-control" style="width: 200px;"
                       th:value="${selectedDate}">
                <button type="submit" class="btn btn-primary btn-sm">조회</button>
            </form>
        </div>

        <!-- 학부모 메모: 저장된 상태면 카드, 아니면 작성 폼 -->
        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="fw-bold" style="color: var(--primary)">전달할 내용</div>
                    <button th:if="${memo != null}" type="button" class="btn btn-outline-secondary btn-sm"
                            onclick="toggleMemoEdit()">수정</button>
                </div>

                <div th:if="${param.saved != null}" class="alert alert-success py-2 mb-3" role="alert">
                    ✓ 저장되었습니다.
                </div>

                <!-- 저장된 내용 카드 -->
                <div id="memoView" th:if="${memo != null}">
                    <div class="p-3 rounded mb-3" style="background-color: var(--primary-light); white-space: pre-wrap;"
                         th:text="${memo.content}"></div>
                    <div th:if="${not #lists.isEmpty(memo.photos)}" class="d-flex gap-2 flex-wrap">
                        <img th:each="photo : ${memo.photos}"
                             th:src="@{/uploads/{file}(file=${photo.filePath})}"
                             class="rounded" style="width: 80px; height: 80px; object-fit: cover; cursor: pointer;"
                             th:onclick="|window.open('/uploads/' + '${photo.filePath}', '_blank')|">
                    </div>
                </div>

                <!-- 작성/수정 폼 -->
                <form id="memoForm" th:action="@{/parent/notice/memo}" method="post" enctype="multipart/form-data"
                      th:class="${memo != null} ? 'd-none' : ''">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" name="date" th:value="${selectedDate}">

                    <div class="mb-3">
                        <textarea class="form-control" name="content" rows="4"
                                  placeholder="아이의 기분, 가정에서의 특이사항, 컨디션 등을 적어주세요"
                                  th:text="${memo != null} ? ${memo.content} : ''"></textarea>
                    </div>

                    <div class="mb-3">
                        <input type="file" class="form-control" name="photos" multiple accept="image/*">
                    </div>

                    <div class="d-flex gap-2">
                        <button th:if="${memo != null}" type="button" class="btn btn-outline-secondary px-4"
                                onclick="toggleMemoEdit()">취소</button>
                        <button type="submit" class="btn btn-primary px-4">저장</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 교사가 작성한 알림장이 없을 때 -->
        <div th:if="${notice == null}" class="text-center text-muted py-5">
            아직 선생님이 작성한 알림장이 없습니다.
        </div>

        <!-- 교사가 작성한 알림장 -->
        <th:block th:if="${notice != null}">
            <div class="mb-3">
            <span th:if="${notice.attended}"
                  class="badge px-3 py-2" style="background-color: var(--primary); font-size: 0.9rem;">등원 O</span>
                <span th:unless="${notice.attended}"
                      class="badge bg-secondary px-3 py-2" style="font-size: 0.9rem;">등원 X</span>
            </div>

            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <div class="mb-3" th:if="${notice.meal != null}">
                        <div class="fw-bold mb-1" style="color: var(--primary)">🍚 식사</div>
                        <div th:text="${notice.meal}" class="text-dark"></div>
                    </div>
                    <div class="mb-3" th:if="${notice.play != null}">
                        <div class="fw-bold mb-1" style="color: var(--primary)">🎮 오늘의 놀이</div>
                        <div th:text="${notice.play}" class="text-dark"></div>
                    </div>
                    <div class="mb-3" th:if="${notice.nap != null}">
                        <div class="fw-bold mb-1" style="color: var(--primary)">😴 낮잠</div>
                        <div th:text="${notice.nap}" class="text-dark"></div>
                    </div>
                    <div class="mb-3" th:if="${notice.toilet != null}">
                        <div class="fw-bold mb-1" style="color: var(--primary)">🚽 배변 사항</div>
                        <div th:text="${notice.toilet}" class="text-dark"></div>
                    </div>
                    <div class="mb-3" th:if="${notice.special != null}">
                        <div class="fw-bold mb-1" style="color: var(--primary)">⭐ 특이 사항</div>
                        <div th:text="${notice.special}" class="text-dark"></div>
                    </div>
                    <div class="mb-3" th:if="${notice.extra != null}">
                        <div class="fw-bold mb-1" style="color: var(--primary)">📢 기타 공지</div>
                        <div th:text="${notice.extra}" class="text-dark"></div>
                    </div>

                    <!-- 교사 답변: 말풍선 없이 본문처럼 표시 -->
                    <div class="mb-3"
                         th:each="reply : ${replies}"
                         th:if="${reply.author.role.name() == 'TEACHER' or reply.author.role.name() == 'ADMIN'}">
                        <div class="fw-bold mb-1" style="color: var(--primary)">💬 선생님 답변</div>
                        <div th:text="${reply.content}" class="text-dark"></div>
                    </div>
                </div>
            </div>

            <div th:if="${not #lists.isEmpty(notice.photos)}" class="mb-3">
                <div class="fw-bold mb-2" style="color: var(--primary)">📷 사진</div>
                <div id="photoCarousel" class="carousel slide border rounded p-2" data-bs-ride="false">
                    <div class="carousel-inner">
                        <div th:each="photo, iter : ${notice.photos}"
                             th:class="${iter.first} ? 'carousel-item active' : 'carousel-item'">
                            <div class="position-relative">
                                <img th:src="@{/uploads/{fileName}(fileName=${photo.filePath})}"
                                     class="d-block w-100 rounded"
                                     style="max-height: 350px; object-fit: contain; background: #f8f8f8;">
                                <span class="position-absolute top-0 end-0 badge bg-dark m-2"
                                      th:text="${iter.index + 1} + ' / ' + ${iter.size}"></span>
                            </div>
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button"
                            data-bs-target="#photoCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" style="filter: invert(1)"></span>
                    </button>
                    <button class="carousel-control-next" type="button"
                            data-bs-target="#photoCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon" style="filter: invert(1)"></span>
                    </button>
                </div>
            </div>

            <!-- 학부모 답장 입력 -->
            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <div class="fw-bold mb-3" style="color: var(--primary)">선생님께 답장하기</div>

                    <div th:each="reply : ${replies}"
                         th:if="${reply.author.role.name() == 'PARENT'}"
                         class="mb-2">
                        <div class="p-2 rounded" style="background-color: var(--primary-light);"
                             th:text="${reply.content}"></div>
                    </div>

                    <form th:action="@{/parent/notice/{id}/reply(id=${notice.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="d-flex gap-2">
                            <input type="text" class="form-control" name="content"
                                   placeholder="답장을 입력하세요" required>
                            <button type="submit" class="btn btn-primary px-4">전송</button>
                        </div>
                    </form>
                </div>
            </div>
        </th:block>
    </div>
</th:block>

<th:block layout:fragment="script-extra">
    <script>
        function toggleMemoEdit() {
            document.getElementById('memoView').classList.toggle('d-none');
            document.getElementById('memoForm').classList.toggle('d-none');
        }
    </script>
</th:block>

</html>

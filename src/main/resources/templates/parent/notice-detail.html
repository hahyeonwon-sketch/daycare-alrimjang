<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>알림장 상세 - 어린이집</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="container py-4">

    <!-- 상단 헤더 -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/parent/notice}" class="btn btn-outline-secondary btn-sm">← 목록</a>
            <h4 class="fw-bold mb-0" style="color: var(--primary)"
                th:text="${#temporals.format(notice.date, 'yyyy년 MM월 dd일')} + ' 알림장'"></h4>
        </div>
        <form th:action="@{/auth/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-secondary btn-sm">로그아웃</button>
        </form>
    </div>

    <!-- 등원 여부 -->
    <div class="mb-3">
        <span th:if="${notice.attended}"
              class="badge px-3 py-2" style="background-color: var(--primary); font-size: 0.9rem;">등원 O</span>
        <span th:unless="${notice.attended}"
              class="badge bg-secondary px-3 py-2" style="font-size: 0.9rem;">등원 X</span>
    </div>

    <!-- 알림장 내용 카드 -->
    <div class="card shadow-sm mb-3">
        <div class="card-body">

            <div class="mb-3" th:if="${notice.meal != null}">
                <div class="fw-bold mb-1" style="color: var(--primary)">🍚 식사</div>
                <div th:text="${notice.meal}" class="text-dark"></div>
            </div>

            <div class="mb-3" th:if="${notice.play != null}">
                <div class="fw-bold mb-1" style="color: var(--primary)">🎮 오늘의 놀이</div>
                <div th:text="${notice.play}" class="text-dark"></div>
            </div>

            <div class="mb-3" th:if="${notice.toilet != null}">
                <div class="fw-bold mb-1" style="color: var(--primary)">🚽 배변 사항</div>
                <div th:text="${notice.toilet}" class="text-dark"></div>
            </div>

            <div class="mb-3" th:if="${notice.special != null}">
                <div class="fw-bold mb-1" style="color: var(--primary)">⭐ 특이 사항</div>
                <div th:text="${notice.special}" class="text-dark"></div>
            </div>

            <div class="mb-3" th:if="${notice.extra != null}">
                <div class="fw-bold mb-1" style="color: var(--primary)">📢 기타 공지</div>
                <div th:text="${notice.extra}" class="text-dark"></div>
            </div>

        </div>
    </div>

    <!-- 사진 슬라이드 -->
    <div th:if="${not #lists.isEmpty(notice.photos)}" class="mb-3">
        <div class="fw-bold mb-2" style="color: var(--primary)">📷 사진</div>
        <div id="photoCarousel" class="carousel slide border rounded p-2" data-bs-ride="false">
            <div class="carousel-inner">
                <div th:each="photo, iter : ${notice.photos}"
                     th:class="${iter.first} ? 'carousel-item active' : 'carousel-item'">
                    <div class="position-relative">
                        <img th:src="@{/uploads/{fileName}(fileName=${photo.filePath})}"
                             class="d-block w-100 rounded"
                             style="max-height: 350px; object-fit: contain; background: #f8f8f8;">
                        <span class="position-absolute top-0 end-0 badge bg-dark m-2"
                              th:text="${iter.index + 1} + ' / ' + ${iter.size}"></span>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button"
                    data-bs-target="#photoCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" style="filter: invert(1)"></span>
            </button>
            <button class="carousel-control-next" type="button"
                    data-bs-target="#photoCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" style="filter: invert(1)"></span>
            </button>
        </div>
    </div>

    <!-- 답장 목록 -->
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <div class="fw-bold mb-3" style="color: var(--primary)">💬 답장</div>

            <div th:if="${#lists.isEmpty(notice.replies)}"
                 class="text-muted small mb-3">아직 답장이 없습니다.</div>

            <div th:each="reply : ${notice.replies}" class="mb-3">
                <div class="d-flex justify-content-between">
                    <span class="fw-bold small" th:text="${reply.parent.name}"></span>
                    <span class="text-muted small"
                          th:text="${#temporals.format(reply.createdAt, 'MM/dd HH:mm')}"></span>
                </div>
                <div class="p-2 rounded mt-1"
                     style="background-color: var(--primary-light);"
                     th:text="${reply.content}"></div>
            </div>

            <!-- 답장 입력 -->
            <form th:action="@{/parent/notice/{id}/reply(id=${notice.id})}" method="post">
                <div class="d-flex gap-2">
                    <input type="text" class="form-control" name="content"
                           placeholder="답장을 입력하세요" required>
                    <button type="submit" class="btn btn-primary px-4">전송</button>
                </div>
            </form>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<th:block layout:fragment="content">
    <div>
        <div class="mb-4">
            <h4 class="fw-bold" style="color: var(--primary)">마이페이지</h4>
        </div>

        <!-- 성공/에러 메시지 -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- 내 정보 -->
        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="fw-bold mb-3" style="color: var(--primary)">내 정보</div>
                <div class="row g-2">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">이름</label>
                        <input type="text" class="form-control" th:value="${user.name}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">이메일</label>
                        <input type="text" class="form-control" th:value="${user.email}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">전화번호</label>
                        <input type="text" class="form-control" th:value="${user.phone}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">원아 이름</label>
                        <input type="text" class="form-control"
                               th:value="${child != null} ? ${child.name} : '미연결'" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">소속 반</label>
                        <input type="text" class="form-control"
                               th:value="${child != null} ? ${child.classroom.name} : '미연결'" readonly>
                    </div>
                </div>
            </div>
        </div>

        <!-- 비밀번호 변경 -->
        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="fw-bold mb-3" style="color: var(--primary)">🔒 비밀번호 변경</div>
                <form th:action="@{/mypage/password}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <label class="form-label fw-bold">현재 비밀번호</label>
                            <input type="password" class="form-control" name="currentPassword" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-bold">새 비밀번호</label>
                            <input type="password" class="form-control" name="newPassword" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">변경</button>
                </form>
            </div>
        </div>

        <!-- 알림 설정 -->
        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="fw-bold mb-3" style="color: var(--primary)">🔔 알림 설정</div>
                <form th:action="@{/mypage/notification}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" name="emailNotification"
                               id="emailNotification" th:checked="${user.emailNotification}">
                        <label class="form-check-label" for="emailNotification">이메일 알림 받기</label>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">저장</button>
                </form>
            </div>
        </div>

        <!-- 회원 탈퇴 -->
        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="fw-bold mb-3 text-danger">⚠️ 회원 탈퇴</div>
                <form th:action="@{/mypage/withdraw}" method="post"
                      onsubmit="return confirm('정말 탈퇴하시겠습니까?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="col-md-4">
                        <label class="form-label fw-bold">비밀번호 확인</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-danger mt-3">탈퇴하기</button>
                </form>
            </div>
        </div>
    </div>
</th:block>

</html>

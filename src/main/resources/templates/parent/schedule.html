<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <th:block layout:fragment="head-extra">
        <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    </th:block>
</head>

<th:block layout:fragment="content">
    <div>
        <div class="mb-4">
            <h4 class="fw-bold" style="color: var(--primary)">🌿 일정</h4>
        </div>

        <div class="card shadow-sm p-3" style="overflow: hidden; height: auto;">
            <div class="d-flex gap-2 mb-3 align-items-center">
                <input type="month" id="monthPicker" class="form-control" style="width: 200px;">
                <button class="btn btn-primary btn-sm" onclick="goToMonth()">이동</button>
                <button class="btn btn-outline-secondary btn-sm" onclick="goToToday()">today</button>
            </div>
            <div id="calendar" style="width: 100%;"></div>
        </div>
    </div>

    <div class="modal fade" id="scheduleDetailModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" style="background-color: var(--primary-light);">
                    <h5 class="modal-title fw-bold">일정 상세</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">제목</label>
                        <input type="text" class="form-control" id="detailTitle" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">시작일</label>
                        <input type="date" class="form-control" id="detailDate" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">종료일</label>
                        <input type="date" class="form-control" id="detailEndDate" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">내용</label>
                        <textarea class="form-control" id="detailContent" rows="3" readonly></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary px-4 py-2" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="script-extra">
    <script th:inline="javascript">
        const scheduleData = /*[[${schedules}]]*/ [];
    </script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script>
        let calendar;

        document.addEventListener('DOMContentLoaded', function() {
            calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: 'dayGridMonth',
                locale: 'ko',
                headerToolbar: {
                    left: 'prev',
                    center: 'title',
                    right: 'next'
                },
                events: scheduleData.map(s => ({
                    id: s.id,
                    title: s.title,
                    start: s.date,
                    end: s.endDate ? s.endDate : s.date,
                    extendedProps: { content: s.content, endDate: s.endDate }
                })),
                eventClick: function(info) {
                    document.getElementById('detailTitle').value = info.event.title;
                    document.getElementById('detailDate').value = info.event.startStr;
                    document.getElementById('detailEndDate').value = info.event.extendedProps.endDate || '';
                    document.getElementById('detailContent').value = info.event.extendedProps.content || '';
                    new bootstrap.Modal(document.getElementById('scheduleDetailModal')).show();
                }
            });
            calendar.render();

            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('monthPicker').value = `${yyyy}-${mm}`;
        });

        function goToMonth() {
            const val = document.getElementById('monthPicker').value;
            if (val) calendar.gotoDate(val + '-01');
        }

        function goToToday() {
            calendar.today();
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('monthPicker').value = `${yyyy}-${mm}`;
        }
    </script>
</th:block>

</html>

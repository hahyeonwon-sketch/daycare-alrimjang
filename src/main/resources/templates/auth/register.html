<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - 어린이집 알림장</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div class="login-wrap">
    <div class="login-card" style="width: 480px;">

        <div class="login-logo">🌸</div>
        <div class="login-title">학부모 회원가입</div>

        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/auth/register}" th:object="${registerRequestDto}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-3">
                <label class="form-label">이름</label>
                <input type="text" class="form-control" th:field="*{name}" placeholder="이름을 입력하세요">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">이메일</label>
                <input type="email" class="form-control" th:field="*{email}" placeholder="이메일을 입력하세요">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">비밀번호</label>
                <input type="password" class="form-control" th:field="*{password}" placeholder="비밀번호를 입력하세요">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">전화번호</label>
                <input type="text" class="form-control" th:field="*{phone}" placeholder="010-0000-0000">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">반 이름</label>
                <input type="text" class="form-control" th:field="*{requestedClassName}" placeholder="예) 나비반">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('requestedClassName')}" th:errors="*{requestedClassName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">원아 이름</label>
                <input type="text" class="form-control" th:field="*{requestedChildName}" placeholder="자녀 이름을 입력하세요">
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('requestedChildName')}" th:errors="*{requestedChildName}"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2">가입 신청</button>
        </form>

        <hr>

        <div class="register-text">
            이미 계정이 있으신가요?
            <a th:href="@{/auth/login}" class="btn btn-outline-secondary btn-sm ms-2">로그인</a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

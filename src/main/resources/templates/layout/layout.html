<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: '클로버 어린이집'">클로버 어린이집</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <th:block layout:fragment="head-extra"></th:block>
</head>
<body>

<!-- 네브바 -->
<nav class="navbar navbar-expand-lg" style="background-color: white; border-bottom: 2px solid var(--primary-light);">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}" style="text-decoration: none;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="13" cy="13" r="7" fill="#4A6FA5" opacity="0.85"/>
                    <circle cx="23" cy="13" r="7" fill="#4A6FA5" opacity="0.7"/>
                    <circle cx="13" cy="23" r="7" fill="#4A6FA5" opacity="0.7"/>
                    <circle cx="23" cy="23" r="7" fill="#4A6FA5" opacity="0.55"/>
                    <circle cx="18" cy="18" r="4" fill="white"/>
                    <rect x="17" y="25" width="2" height="7" rx="1" fill="#4A6FA5" opacity="0.6"/>
                </svg>
                <div style="display: flex; flex-direction: column; line-height: 1.1;">
                    <span style="font-size: 18px; font-weight: 500; color: #4A6FA5; letter-spacing: -0.3px;">클로버</span>
                    <span style="font-size: 11px; font-weight: 400; color: #888; letter-spacing: 0.5px;">어린이집</span>
                </div>
            </div>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- 교사 메뉴 -->
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('TEACHER')">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/teacher/notice}"
                       th:classappend="${activePage == 'notice'} ? 'active fw-bold' : ''">알림장</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/teacher/schedule}"
                       th:classappend="${activePage == 'schedule'} ? 'active fw-bold' : ''">일정</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/teacher/announcement}"
                       th:classappend="${activePage == 'announcement'} ? 'active fw-bold' : ''">공지사항</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/teacher/event}"
                       th:classappend="${activePage == 'event'} ? 'active fw-bold' : ''">행사보고</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/teacher/mypage}">마이페이지</a>
                </li>
            </ul>

            <!-- 학부모 메뉴 -->
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('PARENT')">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/parent/notice}"
                       th:classappend="${activePage == 'notice'} ? 'active fw-bold' : ''">알림장</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/parent/schedule}"
                       th:classappend="${activePage == 'schedule'} ? 'active fw-bold' : ''">일정</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/parent/announcement}"
                       th:classappend="${activePage == 'announcement'} ? 'active fw-bold' : ''">공지사항</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/parent/event}"
                       th:classappend="${activePage == 'event'} ? 'active fw-bold' : ''">행사보고</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/parent/mypage}">마이페이지</a>
                </li>
            </ul>

            <!-- 관리자 메뉴 -->
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('ADMIN')">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/dashboard}">대시보드</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/parent}">학부모 승인</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/classroom}">반 관리</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/teacher}">교사 관리</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/child}">원아 관리</a>
                </li>
            </ul>

            <!-- 오른쪽 영역: 알림 아이콘 + 로그아웃 -->
            <div class="d-flex align-items-center gap-2">
                <!-- 학부모 알림 아이콘 -->
                <a class="nav-link position-relative me-1" th:href="@{/parent/notifications}"
                   sec:authorize="hasRole('PARENT')">
                    🔔
                    <span id="notiBadge"
                          class="position-absolute top-0 start-100 translate-middle badge rounded-pill"
                          style="background-color: var(--primary); font-size: 0.65rem; display: none;">0</span>
                </a>

                <!-- 로그아웃 -->
                <form th:action="@{/auth/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">로그아웃</button>
                </form>
            </div>

        </div>
    </div>
</nav>

<!-- 컨텐츠 -->
<div class="container py-4">
    <th:block layout:fragment="content"></th:block>
</div>

<!-- 푸터 -->
<footer style="background-color: var(--primary-light); border-top: 1px solid #C8EDE8;" class="py-3 mt-5">
    <div class="container text-center">
        <span class="text-muted small">클로버 어린이집 알림장 시스템 &copy; 2026</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<th:block layout:fragment="script-extra"></th:block>

<!-- SSE 실시간 알림 (로그인한 사용자만) -->
<div sec:authorize="isAuthenticated()" class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="notificationToast" class="toast align-items-center text-white border-0"
         style="background-color: var(--primary);" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage">
                알림이 도착했습니다.
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script sec:authorize="isAuthenticated()">
    const eventSource = new EventSource('/sse/connect');

    eventSource.addEventListener('notification', function(e) {
        document.getElementById('toastMessage').textContent = e.data;
        const toast = new bootstrap.Toast(document.getElementById('notificationToast'), {
            delay: 5000
        });
        toast.show();
    });

    eventSource.onerror = function() {
        eventSource.close();
    };
</script>

<script sec:authorize="hasRole('PARENT')">
    function updateNotiBadge() {
        fetch('/notifications/unread-count')
            .then(res => res.json())
            .then(count => {
                const badge = document.getElementById('notiBadge');
                if (badge) {
                    if (count > 0) {
                        badge.textContent = count > 99 ? '99+' : count;
                        badge.style.display = 'inline';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            })
            .catch(() => {});
    }
    updateNotiBadge();
    setInterval(updateNotiBadge, 30000);
</script>

</body>
</html>

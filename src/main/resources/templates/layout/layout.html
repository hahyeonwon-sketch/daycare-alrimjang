<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: '새싹 어린이집'">새싹 어린이집</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">

    <th:block layout:fragment="head-extra"></th:block>
</head>
<body>

<!-- 네브바 -->
<nav class="navbar navbar-expand-lg" style="background-color: white; border-bottom: 2px solid var(--primary-light);">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}" style="color: var(--primary)">
             <span style="font-size: 1.3rem;">클로버</span><br>
            <span style="font-size: 0.85rem; font-weight: 400; color: var(--text-muted);">어린이집</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- 교사 메뉴 -->
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('TEACHER')">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/teacher/notice}"
                       th:classappend="${activePage == 'notice'} ? 'active fw-bold' : ''">알림장</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/teacher/schedule}"
                       th:classappend="${activePage == 'schedule'} ? 'active fw-bold' : ''">일정</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/teacher/announcement}"
                       th:classappend="${activePage == 'announcement'} ? 'active fw-bold' : ''">공지사항</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/teacher/event}"
                       th:classappend="${activePage == 'event'} ? 'active fw-bold' : ''">행사보고</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/teacher/mypage}">마이페이지</a>
                </li>
            </ul>

            <!-- 학부모 메뉴 -->
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('PARENT')">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/parent/notice}"
                       th:classappend="${activePage == 'notice'} ? 'active fw-bold' : ''">알림장</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/parent/schedule}"
                       th:classappend="${activePage == 'schedule'} ? 'active fw-bold' : ''">일정</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/parent/announcement}"
                       th:classappend="${activePage == 'announcement'} ? 'active fw-bold' : ''">공지사항</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/parent/event}"
                       th:classappend="${activePage == 'event'} ? 'active fw-bold' : ''">행사보고</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/parent/mypage}">마이페이지</a>
                </li>
            </ul>

            <!-- 관리자 메뉴 -->
            <ul class="navbar-nav me-auto" sec:authorize="hasRole('ADMIN')">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/dashboard}"
                       th:classappend="${activePage == 'dashboard'} ? 'active fw-bold' : ''">대시보드</a>
                </li>
            </ul>

            <!-- 로그아웃 -->
            <form th:action="@{/auth/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-outline-secondary btn-sm">로그아웃</button>
            </form>

        </div>
    </div>
</nav>

<!-- 컨텐츠 -->
<div class="container py-4">
    <th:block layout:fragment="content"></th:block>
</div>

<!-- 푸터 -->
<footer style="background-color: var(--primary-light); border-top: 1px solid #C8EDE8;" class="py-3 mt-5">
    <div class="container text-center">
        <span class="text-muted small">🍀 클로버 어린이집 알림장 시스템 &copy; 2026</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<th:block layout:fragment="script-extra"></th:block>
</body>
</html>
